<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — CivicChain</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="app-shell">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
        <a href="index.html" class="brand sidebar-brand">
            <span class="brand-mark">C</span> CivicChain
        </a>
        <a href="voter-dashboard.html" class="sidebar-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Elections
        </a>
        <a href="results.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
            Results
        </a>
        <a href="profile.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            Profile
        </a>
        <div style="margin-top:auto; padding-top: 24px;">
            <button class="sidebar-link" id="logoutBtn" style="width:100%; border:none; background:none; cursor:pointer; text-align:left;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Log Out
            </button>
        </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
            <div>
                <span class="eyebrow">Voter dashboard</span>
                <h2 id="welcomeHeading" style="margin-bottom:0;">Welcome back</h2>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
                <div id="walletChipContainer"></div>
                <button class="btn btn-primary btn-sm" id="connectWalletBtn">Connect Wallet</button>
            </div>
        </div>

        <h4 style="margin-bottom:16px;">Active &amp; Upcoming Elections</h4>
        <div class="grid-elections stagger" id="electionsGrid">
            <div class="card skeleton" style="height:180px;"></div>
            <div class="card skeleton" style="height:180px;"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>
<script src="js/contract-config.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/wallet.js"></script>
<script src="js/voter-dashboard.js"></script>
</body>
</html>
