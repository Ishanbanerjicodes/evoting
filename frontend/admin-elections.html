<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Elections — CivicChain Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <a href="index.html" class="brand sidebar-brand"><span class="brand-mark">C</span> CivicChain</a>
        <a href="admin-dashboard.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>
        <a href="admin-elections.html" class="sidebar-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M12 3l8 4v5c0 5-3.5 9-8 10-4.5-1-8-5-8-10V7l8-4z"/></svg>
            Elections
        </a>
        <a href="admin-candidates.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            Candidates
        </a>
        <a href="admin-users.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            Voters
        </a>
        <a href="admin-audit.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
            Audit Logs
        </a>
        <div style="margin-top:auto; padding-top: 24px;">
            <button class="sidebar-link" id="logoutBtn" style="width:100%; border:none; background:none; cursor:pointer; text-align:left;">Log Out</button>
        </div>
    </aside>

    <div class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
            <div>
                <span class="eyebrow">Manage</span>
                <h2 style="margin-bottom:0;">Elections</h2>
            </div>
            <div style="display:flex; gap:12px;">
                <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
                <button class="btn btn-primary btn-sm" id="newElectionBtn">+ New Election</button>
            </div>
        </div>

        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>Title</th><th>Status</th><th>Window</th><th>Contract Address</th><th>Actions</th></tr>
                </thead>
                <tbody id="electionsTableBody">
                    <tr><td colspan="5" class="text-muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Create/Edit election modal -->
<!-- Native <dialog> element: the browser itself handles showing, centering,
     and the dark backdrop via showModal()/close() in admin-elections.js.
     No custom display/opacity/z-index CSS is involved, so there's nothing
     left that can silently fail to render. -->
<dialog id="electionModal" class="simple-modal">
    <span class="eyebrow" id="modalMode">New election</span>
    <h4 style="margin-bottom:20px;">Election details</h4>

    <form id="electionForm">
        <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" id="titleInput" class="form-control" placeholder="e.g. Student Council Election 2026" required>
        </div>
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="descriptionInput" class="form-control" rows="3" placeholder="Short description shown to voters"></textarea>
        </div>
        <div class="row g-3">
            <div class="col-6">
                <div class="form-group">
                    <label class="form-label">Start time</label>
                    <input type="datetime-local" id="startTimeInput" class="form-control" required>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group">
                    <label class="form-label">End time</label>
                    <input type="datetime-local" id="endTimeInput" class="form-control" required>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Smart contract address <span class="text-muted">(optional — paste after deploying)</span></label>
            <input type="text" id="contractAddressInput" class="form-control mono" placeholder="0x...">
            <div class="form-hint">Deploy with <span class="mono">npx hardhat run scripts/deploy.js --network localhost</span>, then paste the printed address here.</div>
        </div>
        <div class="form-group">
            <label class="form-label">Status</label>
            <select id="statusInput" class="form-control">
                <option value="draft">Draft</option>
                <option value="upcoming">Upcoming</option>
                <option value="active">Active</option>
                <option value="ended">Ended</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <div style="display:flex; gap:12px; margin-top:24px;">
            <button type="button" class="btn btn-secondary btn-block" id="cancelElectionBtn">Cancel</button>
            <button type="submit" class="btn btn-primary btn-block" id="saveElectionBtn">Save Election</button>
        </div>
    </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-elections.js"></script>
</body>
</html>
