<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — CivicChain</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="auth-shell">
    <div class="auth-visual">
        <a href="index.html" class="brand" style="color:#fff; margin-bottom:48px;">
            <span class="brand-mark">C</span> CivicChain
        </a>
        <h2 style="color:#fff; font-size:var(--fs-3xl); max-width:420px;">Almost there.</h2>
        <p style="color:rgba(255,255,255,0.75); max-width:380px;">Enter the 6-digit code we sent to your email to activate your account.</p>
    </div>

    <div class="auth-form-side">
        <div class="auth-card animate-fade-up">
            <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" style="margin-bottom:24px;"></button>
            <span class="eyebrow">Verify your email</span>
            <h2 style="margin-bottom:8px;">Enter the 6-digit code</h2>
            <p class="text-soft" id="otpText" style="margin-bottom:32px;">We generated a verification code for your account.</p>

            <form id="otpForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="otpInput">Verification code</label>
                    <input type="text" id="otpInput" class="form-control mono" maxlength="6" placeholder="000000" autocomplete="one-time-code" inputmode="numeric" style="text-align:center; font-size:1.5rem; letter-spacing:0.3em;" required>
                    <div class="form-error">Please enter the 6-digit code.</div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="verifyOtpBtn">Verify &amp; Continue</button>
            </form>

            <p class="text-soft" style="text-align:center; margin-top:16px; margin-bottom:0;">
                Didn't get a code?
                <button type="button" id="resendOtpBtn" style="background:none; border:none; padding:0; margin:0; font:inherit; color:var(--color-accent); text-decoration:underline; cursor:pointer;">Resend code</button>
            </p>
            <p class="text-soft" style="text-align:center; margin-top:8px; margin-bottom:0;">
                <a href="register.html">Back to registration</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/verify-otp.js"></script>
</body>
</html>
