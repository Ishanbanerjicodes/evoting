<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Voters — CivicChain Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <a href="index.html" class="brand sidebar-brand"><span class="brand-mark">C</span> CivicChain</a>
        <a href="admin-dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="admin-elections.html" class="sidebar-link">Elections</a>
        <a href="admin-candidates.html" class="sidebar-link">Candidates</a>
        <a href="admin-users.html" class="sidebar-link active">Voters</a>
        <a href="admin-audit.html" class="sidebar-link">Audit Logs</a>
        <div style="margin-top:auto; padding-top: 24px;">
            <button class="sidebar-link" id="logoutBtn" style="width:100%; border:none; background:none; cursor:pointer; text-align:left;">Log Out</button>
        </div>
    </aside>

    <div class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
            <div>
                <span class="eyebrow">Manage</span>
                <h2 style="margin-bottom:0;">Registered Voters</h2>
            </div>
            <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
        </div>

        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>Name</th><th>Email</th><th>Voter ID</th><th>Wallet</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="6" class="text-muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-users.js"></script>
</body>
</html>
