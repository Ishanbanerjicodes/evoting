<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — CivicChain</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">
        <a href="index.html" class="brand"><span class="brand-mark">C</span> CivicChain</a>
        <div class="navbar-actions">
            <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
            <a href="voter-dashboard.html" class="btn btn-secondary btn-sm">Dashboard</a>
        </div>
    </div>
</header>

<main class="container-app" style="padding-top:40px; padding-bottom:80px; max-width:800px;">
    <div class="section-header" style="margin-bottom:32px;">
        <span class="eyebrow">Live results</span>
        <h2 id="resultsTitle">Election Results</h2>
        <p class="text-soft">Tallied directly from the smart contract's on-chain vote counts.</p>
    </div>

    <div id="selectorWrap" style="margin-bottom:32px;">
        <label class="form-label" for="electionSelect">Choose an election</label>
        <select id="electionSelect" class="form-control"></select>
    </div>

    <div id="resultsContent">
        <div class="card skeleton" style="height:220px;"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/results.js"></script>
</body>
</html>
