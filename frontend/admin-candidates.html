<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Candidates — CivicChain Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <a href="index.html" class="brand sidebar-brand"><span class="brand-mark">C</span> CivicChain</a>
        <a href="admin-dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="admin-elections.html" class="sidebar-link">Elections</a>
        <a href="admin-candidates.html" class="sidebar-link active">Candidates</a>
        <a href="admin-users.html" class="sidebar-link">Voters</a>
        <a href="admin-audit.html" class="sidebar-link">Audit Logs</a>
        <div style="margin-top:auto; padding-top: 24px;">
            <button class="sidebar-link" id="logoutBtn" style="width:100%; border:none; background:none; cursor:pointer; text-align:left;">Log Out</button>
        </div>
    </aside>

    <div class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
            <div>
                <span class="eyebrow">Manage</span>
                <h2 style="margin-bottom:0;">Candidates</h2>
            </div>
            <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
        </div>

        <div class="form-group" style="max-width:360px; margin-bottom:24px;">
            <label class="form-label">Election</label>
            <select id="electionSelect" class="form-control"></select>
        </div>

        <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
            <button class="btn btn-primary btn-sm" id="newCandidateBtn">+ Add Candidate</button>
        </div>

        <div class="grid-candidates stagger" id="candidatesGrid">
            <div class="card skeleton" style="height:200px;"></div>
        </div>
    </div>
</div>

<!-- Add/edit candidate modal -->
<dialog id="candidateModal" class="simple-modal">
    <span class="eyebrow">Candidate details</span>
    <h4 style="margin-bottom:20px;">Add candidate</h4>
    <form id="candidateForm">
        <div class="form-group">
            <label class="form-label">Full name</label>
            <input type="text" id="fullNameInput" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">Party name</label>
            <input type="text" id="partyNameInput" class="form-control" placeholder="Independent">
        </div>
        <div class="form-group">
            <label class="form-label">Bio</label>
            <textarea id="bioInput" class="form-control" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">On-chain index</label>
            <input type="number" id="onChainIndexInput" class="form-control" min="0" required>
            <div class="form-hint">Must match this candidate's index in the smart contract's candidate array (0, 1, 2…).</div>
        </div>
        <div style="display:flex; gap:12px; margin-top:24px;">
            <button type="button" class="btn btn-secondary btn-block" id="cancelCandidateBtn">Cancel</button>
            <button type="submit" class="btn btn-primary btn-block" id="saveCandidateBtn">Save</button>
        </div>
    </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-candidates.js"></script>
</body>
</html>
