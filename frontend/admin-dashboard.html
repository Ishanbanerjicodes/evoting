<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — CivicChain</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <a href="index.html" class="brand sidebar-brand"><span class="brand-mark">C</span> CivicChain</a>

        <span class="sidebar-section-label">Overview</span>
        <a href="admin-dashboard.html" class="sidebar-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>

        <span class="sidebar-section-label">Manage</span>
        <a href="admin-elections.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M12 3l8 4v5c0 5-3.5 9-8 10-4.5-1-8-5-8-10V7l8-4z"/></svg>
            Elections
        </a>
        <a href="admin-candidates.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            Candidates
        </a>
        <a href="admin-users.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Voters
        </a>
        <a href="admin-audit.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>
            Audit Logs
        </a>

        <div style="margin-top:auto; padding-top: 24px;">
            <button class="sidebar-link" id="logoutBtn" style="width:100%; border:none; background:none; cursor:pointer; text-align:left;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Log Out
            </button>
        </div>
    </aside>

    <div class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
            <div>
                <span class="eyebrow">Admin dashboard</span>
                <h2 id="welcomeHeading" style="margin-bottom:0;">Election overview</h2>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
                <a href="admin-elections.html" class="btn btn-primary btn-sm">+ New Election</a>
            </div>
        </div>

        <div class="grid-stats stagger" id="statsGrid" style="margin-bottom:40px;">
            <div class="card skeleton" style="height:120px;"></div>
            <div class="card skeleton" style="height:120px;"></div>
            <div class="card skeleton" style="height:120px;"></div>
            <div class="card skeleton" style="height:120px;"></div>
        </div>

        <h4 style="margin-bottom:16px;">Recent Elections</h4>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>Title</th><th>Status</th><th>Window</th><th>Contract</th></tr>
                </thead>
                <tbody id="electionsTableBody">
                    <tr><td colspan="4" class="text-muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-dashboard.js"></script>
</body>
</html>
