<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — CivicChain</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <a href="index.html" class="brand sidebar-brand"><span class="brand-mark">C</span> CivicChain</a>
        <a href="voter-dashboard.html" class="sidebar-link">Elections</a>
        <a href="results.html" class="sidebar-link">Results</a>
        <a href="profile.html" class="sidebar-link active">Profile</a>
        <div style="margin-top:auto; padding-top: 24px;">
            <button class="sidebar-link" id="logoutBtn" style="width:100%; border:none; background:none; cursor:pointer; text-align:left;">Log Out</button>
        </div>
    </aside>

    <div class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
            <div>
                <span class="eyebrow">Account</span>
                <h2 style="margin-bottom:0;">My Profile</h2>
            </div>
            <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
        </div>

        <div class="card" style="max-width:520px;">
            <div style="display:flex; align-items:center; gap:16px; margin-bottom:28px;">
                <div class="candidate-avatar" id="avatarInitials" style="width:64px; height:64px; font-size:var(--fs-xl);"></div>
                <div>
                    <h4 style="margin-bottom:2px;" id="profileName">—</h4>
                    <span class="badge badge-accent"><span class="badge-dot"></span><span id="profileRole">Voter</span></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email address</label>
                <input class="form-control" id="profileEmail" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Linked wallet</label>
                <input class="form-control mono" id="profileWallet" disabled>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script>
(async function () {
    const user = Api.getUser();
    if (!user || !Api.getToken()) { window.location.href = "login.html"; return; }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
        try { await Api.post("/logout", {}); } catch (e) {}
        Api.clearToken();
        window.location.href = "login.html";
    });

    try {
        const res = await Api.get("/profile");
        const p = res.data;
        document.getElementById("avatarInitials").textContent = UI.initials(p.fullName);
        document.getElementById("profileName").textContent = p.fullName;
        document.getElementById("profileRole").textContent = p.role === "admin" ? "Administrator" : "Voter";
        document.getElementById("profileEmail").value = p.email;
        document.getElementById("profileWallet").value = p.walletAddress || "No wallet linked yet";
    } catch (err) {
        UI.toast(err.message, "error");
    }
})();
</script>
</body>
</html>
